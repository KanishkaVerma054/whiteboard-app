events {}

http {
  upstream ws_backend {
    server host.docker.internal:4000;
    server host.docker.internal:4001;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://ws_backend;
      proxy_http_version 1.1;                          # WebSocket needs HTTP/1.1
      proxy_set_header Upgrade $http_upgrade;          # forward the upgrade handshake
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;                          # longer than HEARTBEAT_MS (30s)
    }
  }

  upstream http_backend {
    server host.docker.internal:3001;
    server host.docker.internal:3002;
  }

  server {
    listen 8081;

    location / {
      proxy_pass http://http_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header X-Upstream $upstream_addr always; # TODO: for development only
    }
  }
}